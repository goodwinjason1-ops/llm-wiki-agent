<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daybook</title>
  <meta name="description" content="Journal, to-dos, schedule and voice notes in one place, synced with Google Calendar.">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daybook">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <nav class="sidebar" aria-label="Main">
      <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Daybook</span></div>
      <div class="nav-items" id="nav"></div>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </nav>

    <div class="shell">
      <header class="topbar" id="topbar"></header>
      <main id="main" tabindex="-1"></main>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>

  <div id="sheet-root"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem">Daybook needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
